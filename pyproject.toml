[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-motion-prior-diagnostic"
version = "0.1.0"
description = "Inference-only causal diagnostics for stale motion history in DynamicWAM on DOMINO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
test = ["pytest>=8.0"]

[project.scripts]
smp-analyze = "stale_motion_prior.analysis:main"
smp-matrix = "stale_motion_prior.matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

